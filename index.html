<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#16141F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Little Log</title>

<style>
:root{
  --bg:#FFF8F3; --surface:#FFFFFF; --surface-2:#FBF1EA; --line:#EFE2D8;
  --text:#2B2330; --muted:#857A86; --accent:#F08A5D; --accent-ink:#FFFFFF;
  --feed:#F08A5D; --feed-soft:#FDE6DA;
  --diaper:#2FA59A; --diaper-soft:#D7F1EE; --dirty:#B9874A; --dirty-soft:#F3E6D3;
  --sleep:#6E64D8; --sleep-soft:#E4E1FA;
  --danger:#D6455D; --shadow:0 1px 2px rgba(60,30,20,.06),0 6px 20px rgba(60,30,20,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141F; --surface:#211E2C; --surface-2:#2A2638; --line:#353046;
    --text:#F2EEF6; --muted:#A49CB2; --accent:#F59A70; --accent-ink:#1A1420;
    --feed:#F59A70; --feed-soft:#43302C;
    --diaper:#4CC3B7; --diaper-soft:#203B3A; --dirty:#D4A46A; --dirty-soft:#3D3226;
    --sleep:#9A92F0; --sleep-soft:#2E2A4D;
    --danger:#F07087; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141F; --surface:#211E2C; --surface-2:#2A2638; --line:#353046;
  --text:#F2EEF6; --muted:#A49CB2; --accent:#F59A70; --accent-ink:#1A1420;
  --feed:#F59A70; --feed-soft:#43302C;
  --diaper:#4CC3B7; --diaper-soft:#203B3A; --dirty:#D4A46A; --dirty-soft:#3D3226;
  --sleep:#9A92F0; --sleep-soft:#2E2A4D;
  --danger:#F07087; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--feed-soft);display:grid;place-items:center;font-size:22px;flex:none}
.top h1{font-size:20px;margin:0;line-height:1.15}
.top .sub{color:var(--muted);font-size:13px}
.top .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 10px;font-weight:700}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{padding:14px 12px;border-radius:20px;border:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden}
.act .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.act .ic svg{width:22px;height:22px}
.act b{font-size:16px}
.act small{font-size:12px;opacity:.85;line-height:1.25}
.act.feed{background:var(--feed-soft);color:var(--text)} .act.feed .ic{color:var(--feed)}
.act.diaper{background:var(--diaper-soft)} .act.diaper .ic{color:var(--diaper)}
.act.sleep{background:var(--sleep-soft)} .act.sleep .ic{color:var(--sleep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .act .ic{background:rgba(255,255,255,.08)}}
:root[data-theme="dark"] .act .ic{background:rgba(255,255,255,.08)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;border-radius:16px;border:0;width:100%;text-align:left}
.banner.sleep{background:#5B52C9;color:#fff}
.banner.feed{background:#D2663A;color:#fff}
.banner .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px}
.stat .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.sw{width:8px;height:8px;border-radius:3px;display:inline-block}
.list{padding:4px 0}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .ic svg{width:20px;height:20px}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ic.feed{background:var(--feed-soft);color:var(--feed)}
.ic.diaper{background:var(--diaper-soft);color:var(--diaper)}
.ic.sleep{background:var(--sleep-soft);color:var(--sleep)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.dayhead b{font-size:15px}
.dayhead span{font-size:12px;color:var(--muted)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,25,.45);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);
  border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
.sheet h3 .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.sheet h3 .ic svg{width:20px;height:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:0 0 5px 2px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-height:44px}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea.inp{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;min-height:48px;background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.feed{background:#D2663A;color:#fff}
.btn.diaper{background:#23887F;color:#fff}
.btn.sleep{background:#5B52C9;color:#fff}
.btn.danger{background:none;color:var(--danger)}
.btn.block{width:100%}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btnrow .btn{flex:1}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:650;font-size:13px}
.pick button .e{font-size:24px}
.pick button[aria-pressed="true"]{border-color:var(--diaper);background:var(--diaper-soft)}
.amount{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.amount .inp{text-align:center;font-size:24px;font-weight:800}
.amount .step{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;flex:none}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650}
.timer{text-align:center;padding:8px 0 4px}
.timer .big{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .lbl{color:var(--muted);font-size:13px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.side{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.side b{font-size:15px}
.side .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.side small{color:var(--muted);font-size:12px}
.side[aria-pressed="true"]{border-color:var(--feed);background:var(--feed-soft)}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 12px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 14px}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
/* trends */
.chart{padding:14px 14px 10px}
.chart h4{margin:0;font-size:15px}
.chart .cap{font-size:12px;color:var(--muted);margin:2px 0 8px;display:flex;gap:12px;flex-wrap:wrap}
.chart .cap i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avg{stroke:var(--text);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--text);opacity:.06}
.readout{font-size:13px;min-height:20px;margin-top:6px;color:var(--text);font-variant-numeric:tabular-nums}
.readout b{font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.tile .delta{font-size:12px;font-weight:650}
.delta.up{color:var(--diaper)} .delta.down{color:var(--danger)} .delta.flat{color:var(--muted)}
.settings .card{padding:16px}
.vd-toggle{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;margin:0 0 12px;font-weight:650;text-align:left}
.vd-toggle[aria-pressed="true"]{border-color:#E0B21B;background:color-mix(in srgb,#F5C518 16%,var(--surface))}
.vd-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.vd-toggle[aria-pressed="true"] .vd-box{background:#E0B21B;border-color:#E0B21B;color:#fff}
.vd-status{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.vd-status.ok{border-style:solid;border-color:color-mix(in srgb,#E0B21B 60%,var(--line));background:color-mix(in srgb,#F5C518 12%,var(--surface));color:var(--text)}
.cvd{position:absolute;right:2%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#E0B21B;pointer-events:none}
.cal-card{padding:14px 12px 12px}
.cal-big{text-align:center;font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.cal-big small{font-size:18px;font-weight:600;margin-left:6px;color:var(--muted)}
.cal-sub{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 8px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.cal-nav span{font-weight:700;font-size:14px}
.cal-nav .iconbtn{font-size:22px;line-height:1;color:var(--text)}
.cal-nav .iconbtn:disabled{opacity:.3}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);margin-left:26px;position:relative}
.cal-dh{text-align:center;padding:14px 0 6px;border-radius:10px 10px 0 0;position:relative}
.cal-dh i{position:absolute;top:0;left:4px;font-style:normal;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-dh small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.cal-dh b{font-size:17px;font-variant-numeric:tabular-nums}
.cal-dh.on{background:var(--accent);color:var(--accent-ink)} .cal-dh.on small,.cal-dh.on i{color:inherit;opacity:.85}
.cal-body{position:relative;height:440px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal-night{position:absolute;left:26px;right:0;background:var(--surface-2)}
.cal-hl{position:absolute;left:26px;right:0;border-top:1px dashed var(--line)}
.cal-hl span{position:absolute;left:-26px;top:-7px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-cols{position:absolute;left:26px;right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cal-col{position:relative}
.cal-col.on{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.cm,.cs{position:absolute;border:0;padding:0;margin:0;cursor:pointer}
.cm{left:14%;right:14%;height:5px;margin-top:-2.5px;border-radius:3px}
.cm::before{content:"";position:absolute;inset:-6px -3px}
.cm.l{left:6%;right:52%} .cm.r{left:52%;right:6%}
.cm.feed{background:var(--feed)} .cm.wet{background:var(--diaper)} .cm.dirty{background:var(--dirty)}
.cm.mixed{background:linear-gradient(90deg,var(--diaper) 50%,var(--dirty) 50%)} .cm.dry{background:var(--muted)}
.cs{left:22%;right:22%;border-radius:4px;background:var(--sleep);opacity:.9}
.cs.bg{left:2%;right:2%;opacity:.28}
.cal-now{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background:var(--text);opacity:.55;pointer-events:none}
.cal-now::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--text)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:10px 0 2px;font-size:12px;color:var(--muted)}
.cal-legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.cal-cmp{text-align:center;font-size:13px;margin-top:6px}
.cal-cmp .arr{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:6px;font-weight:800;font-size:12px}
.cal-cmp .arr.up{background:var(--feed-soft);color:var(--feed)} .cal-cmp .arr.down{background:var(--sleep-soft);color:var(--sleep)}
.iconbtn{position:relative;color:var(--muted)}
.syncdot{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);background:var(--line)}
.syncdot.ok{background:var(--diaper)} .syncdot.busy{background:var(--sleep);animation:pulse 1s infinite} .syncdot.error{background:var(--danger)}
.syncline{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.syncline .syncdot{position:static;border:0;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;
  transition:.2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{pointer-events:auto;border:0;background:none;color:var(--accent);font-weight:800;margin-left:10px}
@media (max-width:380px){.act{min-height:108px;padding:12px 10px}.act b{font-size:15px}.pick{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- icons ---------- */
const I = {

  diaper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18v4a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/><path d="M3 10c3 0 5 2 5 5M21 10c-3 0-5 2-5 5"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/><path d="M16 3h3l-3 3h3"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const TYPE_IC = {feed:I.bottle, diaper:I.diaper, sleep:I.moon};

/* ---------- state ---------- */
const KEY = "littlelog.v1";
const ML_PER_OZ = 29.5735;
const H = 3600e3, DAY = 24*H, MIN = 60e3;
function blank(){ return {baby:{name:"", birth:""}, babyU:0, settings:{unit:"ml", theme:"auto"}, entries:[], deleted:{}, timers:{}, timersU:0}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.entries)){ const b = blank(); return {...b, ...s, baby:{...b.baby,...s.baby}, settings:{...b.settings,...s.settings}, timers:s.timers||{}, deleted:s.deleted||{}}; }
  }catch(e){}
  return blank();
}
let S = load();
let lastTimers = JSON.stringify(S.timers), lastBaby = JSON.stringify(S.baby);
// Any local change: stamp what changed so cloud merges know which copy is newer, then sync.
function save(){
  const t = JSON.stringify(S.timers), b = JSON.stringify(S.baby);
  if(t !== lastTimers) S.timersU = Date.now();
  if(b !== lastBaby) S.babyU = Date.now();
  persist(); scheduleSync();
}
function persist(){
  lastTimers = JSON.stringify(S.timers); lastBaby = JSON.stringify(S.baby);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
let tab = "home", histFilter = "all", trendRange = 7;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function sod(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function addDays(t, n){ const d = new Date(t); d.setDate(d.getDate()+n); return d.getTime(); }
function dayKey(t){ const d = new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function toInput(t){ const d = new Date(t); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function fromInput(v){ const t = new Date(v).getTime(); return isNaN(t) ? Date.now() : t; }
function fmtTime(t){ return new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
function fmtDur(ms, secs){
  ms = Math.max(0, ms);
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  if(secs){ return h ? h+":"+pad(m)+":"+pad(s%60) : pad(m)+":"+pad(s%60); }
  if(h >= 48) return Math.floor(h/24)+"d "+(h%24)+"h";
  if(h) return h+"h "+pad(m)+"m";
  return m+"m";
}
function ago(t){
  const d = Date.now() - t;
  if(d < MIN) return "just now";
  return fmtDur(d) + " ago";
}
function dayLabel(t){
  const today = sod(Date.now());
  if(sod(t) === today) return "Today";
  if(sod(t) === addDays(today,-1)) return "Yesterday";
  return new Date(t).toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
}
const unit = () => S.settings.unit;
function vol(ml, withUnit=true){
  if(ml == null) return "";
  const v = unit()==="oz" ? (Math.round(ml/ML_PER_OZ*10)/10) : Math.round(ml);
  return withUnit ? v+" "+unit() : String(v);
}
const toMl = v => unit()==="oz" ? v*ML_PER_OZ : v;
const fromMl = ml => unit()==="oz" ? Math.round(ml/ML_PER_OZ*10)/10 : Math.round(ml);
function babyAge(){
  if(!S.baby.birth) return "";
  const b = new Date(S.baby.birth+"T00:00"); const days = Math.floor((sod(Date.now()) - b.getTime())/DAY);
  if(isNaN(days) || days < 0) return "";
  if(days === 0) return "Born today";
  if(days < 14) return days + (days===1?" day":" days") + " old";
  if(days < 84){ const w = Math.floor(days/7), d = days%7; return w+" weeks"+(d?" "+d+(d===1?" day":" days"):"")+" old"; }
  const n = new Date(); let m = (n.getFullYear()-b.getFullYear())*12 + n.getMonth()-b.getMonth(); if(n.getDate() < b.getDate()) m--;
  if(m < 24){ const anchor = new Date(b); anchor.setMonth(b.getMonth()+m); const w = Math.floor((sod(Date.now())-anchor.getTime())/(7*DAY)); return m+" months"+(w?" "+w+(w===1?" week":" weeks"):"")+" old"; }
  return Math.floor(m/12)+" years old";
}
function sorted(){ return S.entries.slice().sort((a,b) => b.start - a.start); }
function lastOf(type, pred){ return sorted().find(e => e.type===type && (!pred || pred(e))); }
function endOf(e){ return e.end || e.start; }

function describe(e){
  if(e.type === "feed"){
    if(e.kind === "breast"){
      const parts = [];
      if(e.left) parts.push("L "+fmtDur(e.left));
      if(e.right) parts.push("R "+fmtDur(e.right));
      return {title:"Breastfeed · "+fmtDur((e.left||0)+(e.right||0)), sub:parts.join(" · ") || "Nursing"};
    }
    if(e.kind === "bottle") return {title:"Bottle"+(e.amount ? " · "+vol(e.amount) : ""), sub:e.milk==="formula" ? "Formula" : "Breast milk"};
    return {title:"Solids"+(e.food?" · "+e.food:""), sub:e.grams ? e.grams+" g" : "Solid food"};
  }
  if(e.type === "diaper"){
    const m = {wet:"Wet", dirty:"Dirty", mixed:"Wet + dirty", dry:"Dry"};
    return {title:"Diaper · "+(m[e.kind]||"Change"), sub:"Change"};
  }
  return {title:"Sleep · "+fmtDur(e.end-e.start), sub:fmtTime(e.start)+" – "+fmtTime(e.end)};
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undo ? '<button type="button">Undo</button>' : "");
  if(undo) t.querySelector("button").onclick = () => { undo(); t.classList.remove("on"); };
  t.classList.add("on"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), undo ? 5000 : 2200);
}

/* ---------- live values (timers, "ago") ---------- */
function feedTimerMs(side){
  const f = S.timers.feed; if(!f) return 0;
  const run = f.side === side ? Date.now() - f.since : 0;
  return (f[side]||0) + run;
}
function liveValue(k){
  if(k === "feedL") return fmtDur(feedTimerMs("L"), true);
  if(k === "feedR") return fmtDur(feedTimerMs("R"), true);
  if(k === "feedT") return fmtDur(feedTimerMs("L")+feedTimerMs("R"), true);
  if(k === "sleepT") return S.timers.sleep ? fmtDur(Date.now()-S.timers.sleep.start, true) : "";
  if(k.startsWith("ago:")) return ago(+k.slice(4));
  return "";
}
function updateLive(){ document.querySelectorAll("[data-live]").forEach(el => { el.textContent = liveValue(el.dataset.live); }); }
setInterval(updateLive, 1000);

/* ---------- views ---------- */
function render(){
  document.documentElement.dataset.theme = S.settings.theme === "auto" ? "" : S.settings.theme;
  if(S.settings.theme === "auto") document.documentElement.removeAttribute("data-theme");
  const tabs = [["home","Today",I.home],["history","History",I.list],["trends","Trends",I.chart],["settings","Settings",I.gear]];
  $("#tabs").innerHTML = tabs.map(([k,l,ic]) => `<button type="button" data-tab="${k}" ${tab===k?'aria-current="page"':""}>${ic}<span>${l}</span></button>`).join("");
  const app = $("#app");
  app.innerHTML = ({home:viewHome, history:viewHistory, trends:viewTrends, settings:viewSettings})[tab]();
  updateLive(); updateSyncUi();
}

function header(sub){
  const name = S.baby.name || "Your baby";
  return `<header class="top"><div class="avatar" aria-hidden="true">👶</div><div><h1>${esc(name)}</h1><div class="sub">${esc(sub || babyAge() || "Tap Settings to add a name and birthday")}</div></div><div class="spacer"></div><button type="button" class="iconbtn" id="syncbtn" data-act="syncbtn" aria-label="Cloud sync">${I.cloud}<span id="syncdot" class="syncdot"></span></button></header>`;
}

function todayTotals(from, to){
  const out = {feeds:0, ml:0, breastMs:0, wet:0, dirty:0, mixed:0, diapers:0, sleepMs:0, naps:0};
  for(const e of S.entries){
    if(e.type === "sleep"){
      const ov = Math.min(e.end, to) - Math.max(e.start, from);
      if(ov > 0){ out.sleepMs += ov; out.naps++; }
      continue;
    }
    if(e.start < from || e.start >= to) continue;
    if(e.type === "feed"){ out.feeds++; if(e.kind==="bottle") out.ml += e.amount||0; if(e.kind==="breast") out.breastMs += (e.left||0)+(e.right||0); }
    if(e.type === "diaper"){ out.diapers++; if(e.kind==="wet"||e.kind==="mixed") out.wet++; if(e.kind==="dirty"||e.kind==="mixed") out.dirty++; if(e.kind==="mixed") out.mixed++; }
  }
  return out;
}

function viewHome(){
  const lf = lastOf("feed"), ld = lastOf("diaper"), ls = lastOf("sleep");
  const lb = lastOf("feed", e => e.kind==="breast");
  const nextSide = lb ? (lb.lastSide === "L" ? "Right" : "Left") : null;

    : lf ? `Last <span data-live="ago:${lf.start}"></span>` : "Not logged yet";
  const sleepSub = S.timers.sleep ? `<span><span class="live-dot"></span>Asleep <span data-live="sleepT"></span></span>`
    : ls ? `Awake <span data-live="ago:${ls.end}"></span>` : "Not logged yet";
  const diaperSub = ld ? `Last <span data-live="ago:${ld.start}"></span>` : "Not logged yet";
  const t0 = sod(Date.now()), T = todayTotals(t0, t0+DAY);
  const recent = sorted().slice(0,6);
  return header() + `
  <div class="actions">
    <button type="button" class="act feed" data-open="feed"><div class="ic">${I.bottle}</div><b>Feed</b><small>${feedSub}</small></button>
    <button type="button" class="act diaper" data-open="diaper"><div class="ic">${I.diaper}</div><b>Diaper</b><small>${diaperSub}</small></button>
    <button type="button" class="act sleep" data-open="sleep"><div class="ic">${I.moon}</div><b>Sleep</b><small>${sleepSub}</small></button>
  </div>
  ${S.timers.sleep ? `<button type="button" class="banner sleep" data-open="sleep">${I.moon.replace("<svg",'<svg width="22" height="22"')}<div><b>Sleeping</b><div style="font-size:12px;opacity:.85">since ${fmtTime(S.timers.sleep.start)} · tap to wake</div></div><span class="t" data-live="sleepT"></span></button>` : ""}
  ${S.timers.feed ? `<button type="button" class="banner feed" data-open="feed">${I.bottle.replace("<svg",'<svg width="22" height="22"')}<div><b>Breastfeeding</b><div style="font-size:12px;opacity:.85">${S.timers.feed.side ? (S.timers.feed.side==="L"?"Left":"Right")+" side" : "Paused"}</div></div><span class="t" data-live="feedT"></span></button>` : ""}
  ${nextSide && !S.timers.feed ? `<div class="hint" style="margin:10px 4px 0">Next breast side: <b style="color:var(--feed)">${nextSide}</b> (last ended on ${nextSide==="Left"?"right":"left"})</div>` : ""}
  ${vitDStatus()}
  <h2 class="sec">Today so far</h2>
  <div class="stats">
    <div class="card stat"><div class="k"><span class="sw" style="background:var(--feed)"></span>Feeds</div><div class="v">${T.feeds}</div><div class="d">${T.ml ? vol(T.ml)+" bottle" : "No bottles"}${T.breastMs ? " · "+fmtDur(T.breastMs)+" nursing" : ""}</div></div>
    <div class="card stat"><div class="k"><span class="sw" style="background:var(--diaper)"></span>Diapers</div><div class="v">${T.diapers}</div><div class="d">${T.wet} wet · ${T.dirty} dirty</div></div>
    <div class="card stat"><div class="k"><span class="sw" style="background:var(--sleep)"></span>Sleep</div><div class="v">${fmtDur(T.sleepMs)}</div><div class="d">${T.naps} ${T.naps===1?"stretch":"stretches"}</div></div>
    <div class="card stat"><div class="k"><span class="sw" style="background:var(--feed)"></span>Bottle total</div><div class="v">${vol(T.ml,false)}<small>${unit()}</small></div><div class="d">${lf ? "Last feed "+fmtTime(lf.start) : "—"}</div></div>
  </div>
  <h2 class="sec">Recent</h2>
  <div class="card list">${recent.length ? recent.map(rowHtml).join("") : `<div class="empty">Nothing logged yet.<br>Tap <b>Feed</b>, <b>Diaper</b> or <b>Sleep</b> above to start.</div>`}</div>`;
}

function vitDStatus(){
  const t0 = sod(Date.now());
  const given = S.entries.filter(e => e.vitD && e.start >= t0).sort((a,b) => a.start - b.start)[0];
  return `<div class="vd-status${given ? " ok" : ""}">💊 <span>${given ? `Vitamin D given today at <b>${fmtTime(given.start)}</b>` : "Vitamin D not given yet today"}</span></div>`;
}
function rowHtml(e){
  const d = describe(e);
  return `<button type="button" class="row" data-edit="${e.id}"><div class="ic ${e.type}">${TYPE_IC[e.type]}</div><div class="main"><b>${esc(d.title)}</b><span>${e.vitD ? "💊 Vitamin D · " : ""}${esc(e.note ? d.sub+" · "+e.note : d.sub)}</span></div><time>${fmtTime(e.start)}</time></button>`;
}

function viewHistory(){
  const list = sorted().filter(e => histFilter==="all" || e.type===histFilter);
  const groups = [];
  for(const e of list){
    const k = dayKey(e.start);
    if(!groups.length || groups[groups.length-1].k !== k) groups.push({k, t:e.start, items:[]});
    groups[groups.length-1].items.push(e);
  }
  const chips = [["all","All"],["feed","Feeds"],["diaper","Diapers"],["sleep","Sleep"]]
    .map(([k,l]) => `<button type="button" class="chip" data-hfilter="${k}" aria-pressed="${histFilter===k}">${l}</button>`).join("");
  return header("History") + `<div class="chips">${chips}</div>` +
    (groups.length ? groups.map(g => {
      const s = sod(g.t), T = todayTotals(s, s+DAY);
      return `<div class="dayhead"><b>${dayLabel(g.t)}</b><span>${T.feeds} feeds · ${T.diapers} diapers · ${fmtDur(T.sleepMs)} sleep</span></div><div class="card list">${g.items.map(rowHtml).join("")}</div>`;
    }).join("") : `<div class="card empty" style="margin-top:12px">No entries${histFilter!=="all"?" of this type":""} yet.</div>`);
}

/* ---------- trends ---------- */
function dailySeries(days){
  const today = sod(Date.now());
  const out = [];
  for(let i = days-1; i >= 0; i--){
    const s = addDays(today, -i), e = addDays(s, 1);
    out.push({start:s, ...todayTotals(s, e)});
  }
  return out;
}
function niceMax(v){ if(v <= 0) return 1; const p = 10**Math.floor(Math.log10(v)); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
const charts = {};
function barChart(id, rows, series, opt={}){
  const W = 340, Hh = 150, L = 30, B = 20, T = 6, n = rows.length;
  const iw = W - L - 4, ih = Hh - B - T, bw = iw/n;
  const totals = rows.map(r => series.reduce((a,s) => a + s.get(r), 0));
  const max = niceMax(Math.max(...totals, opt.min||0));
  const y = v => T + ih - v/max*ih;
  let g = "";
  for(let k = 0; k <= 4; k++){ const v = max*k/4; g += `<line class="grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${opt.axis ? opt.axis(v) : +v.toFixed(1)}</text>`; }
  let bars = "", labels = "", hits = "";
  const every = n <= 7 ? 1 : n <= 14 ? 2 : 5;
  rows.forEach((r, i) => {
    const x = L + i*bw, w = Math.max(2, bw*0.62), x0 = x + (bw-w)/2;
    let acc = 0;
    series.forEach((s, si) => {
      const v = s.get(r); if(v <= 0) return;
      const y1 = y(acc + v), y0 = y(acc); acc += v;
      const top = si === series.length-1 || series.slice(si+1).every(t => t.get(r) <= 0);
      const rr = top ? Math.min(4, w/2, y0-y1) : 0;
      bars += top
        ? `<path d="M${x0},${y0} V${y1+rr} q0,-${rr} ${rr},-${rr} H${x0+w-rr} q${rr},0 ${rr},${rr} V${y0} Z" fill="${s.color}"/>`
        : `<rect x="${x0}" y="${y1}" width="${w}" height="${y0-y1}" fill="${s.color}"/>`;
    });
    if((n-1-i) % every === 0){
      const d = new Date(r.start);
      labels += `<text x="${x+bw/2}" y="${Hh-5}" text-anchor="middle">${n<=7 ? d.toLocaleDateString([], {weekday:"short"}) : d.getDate()}</text>`;
    }
    hits += `<rect class="hit" data-chart="${id}" data-i="${i}" x="${x}" y="${T}" width="${bw}" height="${ih+B}"/>`;
  });
  const vals = totals.slice(0, -1).filter((v, i) => rows[i].start >= firstDay());  // exclude today (partial) and days before tracking began
  const avg = vals.length ? vals.reduce((a,b) => a+b, 0)/vals.length : 0;
  const avgLine = avg ? `<line class="avg" x1="${L}" x2="${W-4}" y1="${y(avg)}" y2="${y(avg)}"/>` : "";
  charts[id] = {rows, series, fmt:opt.fmt, avg};
  const sel = opt.sel != null ? `<rect class="sel" x="${L+opt.sel*bw}" y="${T}" width="${bw}" height="${ih}" rx="4"/>` : "";
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(opt.label||"")}">${g}${sel}${avgLine}${bars}${labels}${hits}</svg>`;
}
function readout(id, i){
  const c = charts[id]; if(!c) return "";
  if(i == null) return c.avg ? `Daily average <b>${c.fmt(c.avg)}</b> · tap a bar for details` : "Tap a bar for details";
  const r = c.rows[i];
  const parts = c.series.map(s => `${s.name} <b>${c.fmt(s.get(r))}</b>`);
  return `<b>${dayLabel(r.start)}</b> · ` + parts.join(" · ");
}
function longestSleep(from){
  let best = 0;
  for(const e of S.entries) if(e.type === "sleep" && e.end > from) best = Math.max(best, e.end - e.start);
  return best;
}
function firstDay(){ let m = Infinity; for(const e of S.entries) if(e.start < m) m = e.start; return m === Infinity ? 0 : sod(m); }
function avgOf(rows, f){ const r = rows.slice(0, -1).filter(x => x.start >= firstDay()); return r.length ? r.reduce((a,x) => a + f(x), 0)/r.length : 0; }
function deltaHtml(cur, prev, fmt, higherIsGood=true){
  if(!prev || !cur) return `<div class="delta flat">&nbsp;</div>`;
  const pct = Math.round((cur-prev)/prev*100);
  if(Math.abs(pct) < 3) return `<div class="delta flat">Steady vs. previous ${trendRange}d</div>`;
  const up = pct > 0;
  return `<div class="delta ${up===higherIsGood?"up":"down"}">${up?"▲":"▼"} ${Math.abs(pct)}% vs. previous ${trendRange}d</div>`;
}
let chartSel = {};
function viewTrends(){
  const n = trendRange;
  const all = dailySeries(n*2 + 1);   // previous period + current period (+ today)
  const rows = all.slice(n+1), prev = all.slice(0, n+1);
  const chips = [7,14,30].map(d => `<button type="button" class="chip" data-range="${d}" aria-pressed="${n===d}">${d} days</button>`).join("");
  if(!S.entries.length){
    return header("Trends") + `<div class="chips">${chips}</div><div class="card empty" style="margin-top:12px">Trends appear once you've logged a few days.</div>`;
  }
  const a = {
    feeds: avgOf(rows, r => r.feeds), pfeeds: avgOf(prev, r => r.feeds),
    ml: avgOf(rows, r => r.ml), pml: avgOf(prev, r => r.ml),
    dia: avgOf(rows, r => r.diapers), pdia: avgOf(prev, r => r.diapers),
    sl: avgOf(rows, r => r.sleepMs), psl: avgOf(prev, r => r.sleepMs)
  };
  const hrs = ms => +(ms/H).toFixed(1);
  const tiles = `<div class="tiles">
    <div class="card tile"><div class="k">Feeds / day</div><div class="v">${a.feeds.toFixed(1)}</div>${deltaHtml(a.feeds, a.pfeeds)}</div>
    <div class="card tile"><div class="k">Bottle / day</div><div class="v">${vol(a.ml,false)}<small>${unit()}</small></div>${deltaHtml(a.ml, a.pml)}</div>
    <div class="card tile"><div class="k">Diapers / day</div><div class="v">${a.dia.toFixed(1)}</div>${deltaHtml(a.dia, a.pdia)}</div>
    <div class="card tile"><div class="k">Sleep / day</div><div class="v">${fmtDur(a.sl)}</div>${deltaHtml(a.sl, a.psl)}</div>
    <div class="card tile" style="grid-column:1/-1"><div class="k">Longest sleep stretch (last ${n} days)</div><div class="v">${fmtDur(longestSleep(rows[0].start))}</div></div>
  </div>`;
  const C = (id, title, caption, svg) => `<div class="card chart" style="margin-top:12px"><h4>${title}</h4><div class="cap">${caption}</div>${svg}<div class="readout" id="ro-${id}">${readout(id, chartSel[id])}</div></div>`;
  const key = (c, l) => `<i><span class="sw" style="background:${c}"></span>${l}</i>`;
  const s1 = barChart("ml", rows, [{name:"Bottle", color:"var(--feed)", get:r => fromMl(r.ml)}], {fmt:v => (unit()==="oz" ? Math.round(v*10)/10 : Math.round(v))+" "+unit(), axis:v => Math.round(v), sel:chartSel.ml, label:"Bottle volume per day"});
  const s2 = barChart("feeds", rows, [{name:"Feeds", color:"var(--feed)", get:r => r.feeds}], {fmt:v => (+v.toFixed(1))+"", sel:chartSel.feeds, label:"Feeds per day", min:4});
  const s3 = barChart("nurse", rows, [{name:"Nursing", color:"var(--feed)", get:r => Math.round(r.breastMs/MIN)}], {fmt:v => fmtDur(v*MIN), axis:v => Math.round(v), sel:chartSel.nurse, label:"Nursing minutes per day", min:20});
  const s4 = barChart("dia", rows, [{name:"Wet", color:"var(--diaper)", get:r => r.wet - r.mixed}, {name:"Dirty", color:"var(--dirty)", get:r => r.dirty - r.mixed}, {name:"Both", color:"color-mix(in srgb, var(--dirty) 50%, var(--diaper))", get:r => r.mixed}, {name:"Dry", color:"var(--line)", get:r => r.diapers - r.wet - r.dirty + r.mixed}], {fmt:v => (+v.toFixed(1))+"", sel:chartSel.dia, label:"Diapers per day", min:4});
  const s5 = barChart("sleep", rows, [{name:"Sleep", color:"var(--sleep)", get:r => hrs(r.sleepMs)}], {fmt:v => fmtDur(v*H), axis:v => v+"h", sel:chartSel.sleep, label:"Sleep hours per day", min:4});
  return header("Trends") + `<h2 class="sec" style="margin-top:6px">Through the day</h2>` + calendarCard() + `<div class="chips" style="margin-top:22px">${chips}</div>` + `<h2 class="sec">Averages</h2>` + tiles +
    `<h2 class="sec">Feeding</h2>` +
    C("ml", "Bottle volume", key("var(--feed)", "Per day")+`<i>– – Average</i>`, s1) +
    C("feeds", "Feeds per day", key("var(--feed)", "Bottle, breast & solids"), s2) +
    (rows.some(r => r.breastMs) ? C("nurse", "Nursing time", key("var(--feed)", "Minutes per day"), s3) : "") +
    `<h2 class="sec">Diapers</h2>` +
    C("dia", "Diapers per day", key("var(--diaper)", "Wet")+key("var(--dirty)", "Dirty")+key("color-mix(in srgb, var(--dirty) 50%, var(--diaper))", "Both")+key("var(--line)", "Dry"), s4) +
    `<h2 class="sec">Sleep</h2>` +
    C("sleep", "Sleep per day", key("var(--sleep)", "Hours"), s5) +
    `<p class="hint" style="margin-top:12px;text-align:center">Averages leave out today, since it isn't over yet.</p>`;
}

/* ---------- week calendar: when things happen through the day ---------- */
let calWeek = 0, calFilter = "feed";
const NIGHT_START = 19, NIGHT_END = 7;
function windowStats(days){
  const today = sod(Date.now()), first = firstDay();
  const full = days.filter(d => d < today && d >= first);
  const use = full.length ? full : days.filter(d => d >= first);
  const tot = use.map(d => todayTotals(d, addDays(d, 1)));
  const avg = f => tot.length ? tot.reduce((a, t) => a + f(t), 0) / tot.length : 0;
  return {n:tot.length, feeds:avg(t => t.feeds), ml:avg(t => t.ml), diapers:avg(t => t.diapers), wet:avg(t => t.wet), dirty:avg(t => t.dirty), sleep:avg(t => t.sleepMs)};
}
function calendarCard(){
  const today = sod(Date.now()), now = Date.now();
  const last = addDays(today, -7 * calWeek);
  const days = Array.from({length:7}, (_, i) => addDays(last, i - 6));
  const d0 = days[0], d1 = addDays(last, 1);
  const cur = windowStats(days), prev = windowStats(days.map(d => addDays(d, -7)));
  const f = calFilter;
  const pct = t => (t / DAY * 100).toFixed(3) + "%";

  // headline + comparison with the 7 days before
  const cmp = (a, b, fmt, word) => {
    if(!cur.n || !prev.n || !b) return "";
    const d = a - b; if(Math.abs(d) / b < 0.01) return `<div class="cal-cmp">Same as the previous 7 days</div>`;
    return `<div class="cal-cmp"><span class="arr ${d > 0 ? "up" : "down"}">${d > 0 ? "↑" : "↓"}</span>${fmt(Math.abs(d))} ${d > 0 ? "more" : "less"}${word ? " " + word : ""} than the previous 7 days</div>`;
  };
  let big, sub, cm;
  const v1 = n => (+n.toFixed(1)).toString();
  if(f === "feed"){
    big = cur.ml ? `${vol(cur.ml, false)}<small>${unit()} per day</small>` : `${v1(cur.feeds)}<small>feeds per day</small>`;
    sub = `${v1(cur.feeds)} feeds a day` + (cur.feeds ? ` · about every ${fmtDur(DAY / cur.feeds)}` : "");
    cm = cur.ml ? cmp(cur.ml, prev.ml, v => vol(v), "") : cmp(cur.feeds, prev.feeds, v1, "feeds");
  } else if(f === "diaper"){
    big = `${v1(cur.diapers)}<small>diapers per day</small>`;
    sub = `${v1(cur.wet)} wet · ${v1(cur.dirty)} dirty a day`;
    cm = cmp(cur.diapers, prev.diapers, v1, "diapers");
  } else if(f === "sleep"){
    big = `${fmtDur(cur.sleep)}<small>sleep per day</small>`;
    let best = 0; for(const e of S.entries) if(e.type === "sleep" && e.end > d0 && e.start < d1) best = Math.max(best, e.end - e.start);
    sub = best ? `Longest stretch ${fmtDur(best)}` : "No sleep logged this week";
    cm = cmp(cur.sleep, prev.sleep, v => fmtDur(v), "sleep");
  } else {
    big = `<span style="font-size:20px">${v1(cur.feeds)} feeds · ${v1(cur.diapers)} diapers · ${fmtDur(cur.sleep)} sleep</span>`;
    sub = "Average per day"; cm = "";
  }

  // marks per day column
  const cols = days.map(d => {
    const e1 = addDays(d, 1); let m = "";
    for(const e of S.entries){
      if(e.type === "sleep" && (f === "sleep" || f === "all") && e.end > d && e.start < e1){
        const a = Math.max(e.start, d) - d, b = Math.min(e.end, e1) - d;
        m += `<button type="button" class="cs${f === "all" ? " bg" : ""}" data-edit="${e.id}" style="top:${pct(a)};height:max(4px, ${pct(b - a)})" title="${esc(describe(e).title)}"></button>`;
      }
      if(e.start < d || e.start >= e1) continue;
      if(e.type === "feed" && (f === "feed" || f === "all"))
        m += `<button type="button" class="cm feed${f === "all" ? " l" : ""}" data-edit="${e.id}" style="top:${pct(e.start - d)}" title="${esc(fmtTime(e.start) + " · " + describe(e).title)}"></button>`;
      if(e.vitD && (f === "feed" || f === "all" || f === e.type) && e.type !== "sleep")
        m += `<span class="cvd" style="top:${pct(e.start - d)}"></span>`;
      if(e.type === "diaper" && (f === "diaper" || f === "all"))
        m += `<button type="button" class="cm ${e.kind}${f === "all" ? " r" : ""}" data-edit="${e.id}" style="top:${pct(e.start - d)}" title="${esc(fmtTime(e.start) + " · " + describe(e).title)}"></button>`;
    }
    if(d === today) m += `<div class="cal-now" style="top:${pct(now - d)}"></div>`;
    return `<div class="cal-col${d === today ? " on" : ""}">${m}</div>`;
  }).join("");
  const heads = days.map((d, i) => { const x = new Date(d);
    return `<div class="cal-dh${d === today ? " on" : ""}">${i === 0 || x.getDate() === 1 ? `<i>${x.toLocaleDateString([], {month:"short"})}</i>` : ""}<small>${x.toLocaleDateString([], {weekday:"short"}).slice(0, 2)}</small><b>${x.getDate()}</b></div>`; }).join("");
  let grid = "";
  for(let h = 0; h <= 24; h += 3) grid += `<div class="cal-hl" style="top:${pct(h * H)}"><span>${pad(h)}</span></div>`;
  const range = new Date(d0).toLocaleDateString([], {month:"short", day:"numeric"}) + " – " + new Date(last).toLocaleDateString([], {month:"short", day:"numeric"});
  const legend = f === "feed" ? `<i><span class="sw" style="background:var(--feed)"></span>Feed</i><i><span class="sw" style="background:#E0B21B;border-radius:50%"></span>Vitamin D</i>`
    : f === "diaper" ? `<i><span class="sw" style="background:var(--diaper)"></span>Wet</i><i><span class="sw" style="background:var(--dirty)"></span>Dirty</i><i><span class="sw" style="background:linear-gradient(90deg,var(--diaper) 50%,var(--dirty) 50%)"></span>Both</i>`
    : f === "sleep" ? `<i><span class="sw" style="background:var(--sleep)"></span>Sleep</i>`
    : `<i><span class="sw" style="background:var(--feed)"></span>Feed</i><i><span class="sw" style="background:var(--diaper)"></span>Diaper</i><i><span class="sw" style="background:var(--sleep);opacity:.4"></span>Sleep</i>`;
  return `<div class="card cal-card">
    <div class="seg" style="margin-bottom:10px">${[["feed","Feeds"],["diaper","Diapers"],["sleep","Sleep"],["all","All"]].map(([k,l]) => `<button type="button" data-calf="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
    <div class="cal-big">${big}</div><div class="cal-sub">${sub}</div>
    <div class="cal-nav"><button type="button" class="iconbtn" data-calnav="1" aria-label="Previous week">‹</button><span>${range}</span><button type="button" class="iconbtn" data-calnav="-1" aria-label="Next week" ${calWeek ? "" : "disabled"}>›</button></div>
    <div class="cal-head">${heads}</div>
    <div class="cal-body">
      <div class="cal-night" style="top:0;height:${pct(NIGHT_END * H)}"></div><div class="cal-night" style="top:${pct(NIGHT_START * H)};bottom:0"></div>
      ${grid}<div class="cal-cols">${cols}</div>
    </div>
    <div class="cap cal-legend">${legend}</div>
    ${cm}
    <p class="hint" style="margin:6px 0 0;text-align:center">Shaded = night (${NIGHT_START}:00–0${NIGHT_END}:00). Tap a mark to see or edit it.</p>
  </div>`;
}

/* ---------- sheets ---------- */
let sheetEl, scrimEl, sheetRender;
function openSheet(fn){
  closeSheet(true);
  scrimEl = document.createElement("div"); scrimEl.className = "scrim";
  sheetEl = document.createElement("div"); sheetEl.className = "sheet"; sheetEl.setAttribute("role","dialog"); sheetEl.setAttribute("aria-modal","true");
  document.body.append(scrimEl, sheetEl);
  scrimEl.onclick = () => closeSheet();
  sheetRender = fn; refreshSheet();
  requestAnimationFrame(() => { scrimEl.classList.add("on"); sheetEl.classList.add("on"); });
  document.body.style.overflow = "hidden";
}
function refreshSheet(){ if(sheetEl){ sheetEl.innerHTML = '<div class="grab"></div>' + sheetRender(); sheetEl.querySelectorAll("[data-bind]").forEach(bindInput); updateLive(); } }
function closeSheet(instant){
  const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null;
  document.body.style.overflow = "";
  if(!s) return;
  if(instant){ s.remove(); c.remove(); return; }
  s.classList.remove("on"); c.classList.remove("on");
  setTimeout(() => { s.remove(); c.remove(); }, 250);
}
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheetEl) closeSheet(); });

/* the form draft for the open sheet */
let D = {};
function bindInput(el){
  const k = el.dataset.bind;
  el.addEventListener("input", () => { D[k] = el.type === "number" ? (el.value === "" ? "" : +el.value) : el.value; });
}
const field = (label, k, type="text", extra="") => `<label class="f"><span>${label}</span><input class="inp" data-bind="${k}" type="${type}" value="${esc(D[k] ?? "")}" ${extra}></label>`;
const vitDToggle = () => `<button type="button" class="vd-toggle" data-act="vitd" aria-pressed="${!!D.vitD}"><span class="vd-box">${D.vitD ? "✓" : ""}</span>💊 Vitamin D given</button>`;
const noteField = () => vitDToggle() + `<label class="f"><span>Note (optional)</span><textarea class="inp" data-bind="note" placeholder="Anything worth remembering">${esc(D.note||"")}</textarea></label>`;
const sheetTitle = (type, text) => `<h3><span class="ic ${type}">${TYPE_IC[type]}</span>${text}</h3>`;

function openFeed(entry){
  if(entry) D = {id:entry.id, kind:entry.kind, time:toInput(entry.start), amount:entry.amount!=null ? fromMl(entry.amount) : "", milk:entry.milk||"breastmilk",
    leftMin:entry.left ? Math.round(entry.left/MIN) : "", rightMin:entry.right ? Math.round(entry.right/MIN) : "", lastSide:entry.lastSide, food:entry.food||"", grams:entry.grams||"", note:entry.note||"", vitD:!!entry.vitD};
  else {
    const lastBottle = lastOf("feed", e => e.kind==="bottle");
    const lastFeed = lastOf("feed");
    D = {kind:S.timers.feed ? "breast" : (lastFeed ? lastFeed.kind : "bottle"), time:toInput(Date.now()), amount:lastBottle ? fromMl(lastBottle.amount) : (unit()==="oz"?3:90),
      milk:lastBottle ? lastBottle.milk : "breastmilk", leftMin:"", rightMin:"", food:"", grams:"", note:""};
  }
  openSheet(feedSheet);
}
function feedSheet(){
  const editing = !!D.id;
  const kinds = [["breast","Breast"],["bottle","Bottle"],["solids","Solids"]];
  let body = "";
  if(D.kind === "breast" && !editing){
    const f = S.timers.feed;
    const lb = lastOf("feed", e => e.kind==="breast");
    const suggest = lb ? (lb.lastSide === "L" ? "R" : "L") : null;
    const sideBtn = s => `<button type="button" class="side" data-side="${s}" aria-pressed="${f && f.side===s}"><b>${s==="L"?"Left":"Right"}</b><span class="t" data-live="feed${s}">00:00</span><small>${f && f.side===s ? "Running · tap to pause" : f ? "Tap to switch" : suggest===s ? "Suggested next" : "Tap to start"}</small></button>`;
    body = `<div class="timer"><div class="big" data-live="feedT">00:00</div><div class="lbl">${f ? (f.side ? "Started "+fmtTime(f.startedAt) : "Paused") : "Tap a side to start the timer"}</div></div>
      <div class="sides">${sideBtn("L")}${sideBtn("R")}</div>
      ${f ? vitDToggle() + `<div class="btnrow"><button type="button" class="btn danger" data-act="feed-discard">Discard</button><button type="button" class="btn feed" data-act="feed-stop">Done · save</button></div>` : ""}
      ${f ? "" : `<div class="divider">or log a past feed</div>
      <label class="f"><span>Started</span><input class="inp" data-bind="time" type="datetime-local" value="${esc(D.time)}"></label>
      <div class="two">${field("Left (minutes)","leftMin","number",'inputmode="numeric" min="0" placeholder="0"')}${field("Right (minutes)","rightMin","number",'inputmode="numeric" min="0" placeholder="0"')}</div>
      ${noteField()}
      <button type="button" class="btn feed block" data-act="feed-save">Save feed</button>`}`;
  } else if(D.kind === "breast"){
    body = `<label class="f"><span>Started</span><input class="inp" data-bind="time" type="datetime-local" value="${esc(D.time)}"></label>
      <div class="two">${field("Left (minutes)","leftMin","number",'inputmode="numeric" min="0"')}${field("Right (minutes)","rightMin","number",'inputmode="numeric" min="0"')}</div>
      ${noteField()}`;
  } else if(D.kind === "bottle"){
    const q = unit()==="oz" ? [1,2,3,4,5,6] : [30,60,90,120,150,180];
    body = `<label class="f"><span>Time</span><input class="inp" data-bind="time" type="datetime-local" value="${esc(D.time)}"></label>
      <label class="f" style="margin-bottom:6px"><span>Amount (${unit()})</span></label>
      <div class="amount"><button type="button" class="step" data-step="-1" aria-label="Less">−</button><input class="inp" id="amt" data-bind="amount" type="number" inputmode="decimal" min="0" step="${unit()==="oz"?0.5:5}" value="${esc(D.amount)}"><button type="button" class="step" data-step="1" aria-label="More">+</button></div>
      <div class="quick">${q.map(v => `<button type="button" data-amt="${v}">${v} ${unit()}</button>`).join("")}</div>
      <div class="seg">${[["breastmilk","Breast milk"],["formula","Formula"]].map(([k,l]) => `<button type="button" data-milk="${k}" aria-pressed="${D.milk===k}">${l}</button>`).join("")}</div>
      ${noteField()}`;
  } else {
    body = `<label class="f"><span>Time</span><input class="inp" data-bind="time" type="datetime-local" value="${esc(D.time)}"></label>
      <div class="two">${field("Food","food","text",'placeholder="e.g. Banana"')}${field("Amount (g, optional)","grams","number",'inputmode="numeric" min="0"')}</div>
      ${noteField()}`;
  }
  const footer = (D.kind === "breast" && !editing) ? "" : `<div class="btnrow">${editing ? `<button type="button" class="btn danger" data-act="delete">Delete</button>` : ""}<button type="button" class="btn feed" data-act="feed-save">${editing ? "Save changes" : "Save feed"}</button></div>`;
  return sheetTitle("feed", editing ? "Edit feed" : "Feed") +
    `<div class="seg">${kinds.map(([k,l]) => `<button type="button" data-kind="${k}" aria-pressed="${D.kind===k}">${l}</button>`).join("")}</div>` +
    body + footer;
}
function saveFeed(){
  const start = fromInput(D.time);
  let e = {id:D.id || uid(), type:"feed", kind:D.kind, start};
  if(D.kind === "breast"){
    const l = (+D.leftMin||0)*MIN, r = (+D.rightMin||0)*MIN;
    if(!l && !r){ toast("Add minutes for at least one side"); return; }
    Object.assign(e, {left:l, right:r, end:start+l+r, lastSide: !l ? "R" : !r ? "L" : (D.lastSide || "R")});
  } else if(D.kind === "bottle"){
    const v = +D.amount; if(!(v > 0)){ toast("Enter an amount"); return; }
    Object.assign(e, {amount:Math.round(toMl(v)*10)/10, milk:D.milk});
  } else {
    Object.assign(e, {food:(D.food||"").trim(), grams:+D.grams || undefined});
  }
  if(D.note && D.note.trim()) e.note = D.note.trim();
  if(D.vitD) e.vitD = true;
  upsert(e); closeSheet(); toast(D.id ? "Feed updated" : "Feed logged");
}
function feedTap(side){
  const now = Date.now();
  let f = S.timers.feed;
  if(!f){ S.timers.feed = {startedAt:now, side, since:now, L:0, R:0}; save(); refreshSheet(); render(); return; }
  if(f.side){ f[f.side] = (f[f.side]||0) + (now - f.since); }
  if(f.side === side){ f.side = null; }
  else { f.side = side; f.since = now; f.lastSide = side; }
  save(); refreshSheet(); render();
}
function feedStop(){
  const f = S.timers.feed; if(!f) return;
  const now = Date.now();
  if(f.side){ f[f.side] = (f[f.side]||0) + (now - f.since); f.lastSide = f.side; }
  const total = (f.L||0) + (f.R||0);
  delete S.timers.feed;
  if(total < 1000){ save(); closeSheet(); render(); toast("Timer discarded (too short)"); return; }
  upsert({id:uid(), type:"feed", kind:"breast", start:f.startedAt, end:now, left:Math.round(f.L||0), right:Math.round(f.R||0), lastSide:f.lastSide || (f.R > f.L ? "R" : "L"), ...(D.vitD ? {vitD:true} : {})});
  closeSheet(); toast("Breastfeed saved · "+fmtDur(total));
}

function openDiaper(entry){
  D = entry ? {id:entry.id, kind:entry.kind, time:toInput(entry.start), note:entry.note||"", vitD:!!entry.vitD} : {kind:"wet", time:toInput(Date.now()), note:""};
  openSheet(() => {
    const opts = [["wet","💧","Wet"],["dirty","💩","Dirty"],["mixed","💧💩","Both"],["dry","✨","Dry"]];
    return sheetTitle("diaper", D.id ? "Edit diaper" : "Diaper change") +

function saveDiaper(){

function openSleep(entry){

function saveSleep(){
  const s = fromInput(D.time), e = fromInput(D.endTime);
  if(e <= s){ toast("Wake time must be after sleep time"); return; }
  if(e - s > 20*H){ toast("That's over 20 hours — check the times"); return; }
  const en = {id:D.id || uid(), type:"sleep", start:s, end:e};
  if(D.note && D.note.trim()) en.note = D.note.trim();
  if(D.vitD) en.vitD = true;
  upsert(en); closeSheet(); toast(D.id ? "Sleep updated" : "Sleep logged · "+fmtDur(e-s));
}

function upsert(e){
  e.u = Date.now();
  const i = S.entries.findIndex(x => x.id === e.id);
  if(i >= 0) S.entries[i] = e; else S.entries.push(e);
  save(); render();
}
function removeEntry(id){
  const i = S.entries.findIndex(x => x.id === id); if(i < 0) return;
  const [gone] = S.entries.splice(i, 1);
  S.deleted[id] = Date.now();
  save(); closeSheet(); render();
  toast("Entry deleted", () => { delete S.deleted[id]; gone.u = Date.now(); S.entries.push(gone); save(); render(); });
}
function openEdit(id){
  const e = S.entries.find(x => x.id === id); if(!e) return;
  if(e.type === "feed") openFeed(e); else if(e.type === "diaper") openDiaper(e); else openSleep(e);
}

function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const head = ["type","kind","start","end","duration_min","left_min","right_min","amount_ml","milk","food","grams","vitamin_d","note"];
  const iso = t => t ? new Date(t).toISOString() : "";
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = sorted().reverse().map(e => [e.type, e.kind||"", iso(e.start), iso(e.end), e.end ? Math.round((e.end-e.start)/MIN) : "",

  download("little-log-"+dayKey(Date.now())+".csv", [head.join(","), ...lines].join("\n"), "text/csv");
}

/* ---------- cloud sync (GitHub repo file) ---------- */
// The data is one JSON file in a (private) GitHub repo, read and written with the
// Contents API using a fine-grained token kept only in this browser. Every device
// merges by entry id (newest edit wins, deletions are kept as tombstones), so
// several phones can log at once.
const SYNC_KEY = "littlelog.sync";
function loadSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
let SY = loadSync();
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch(e){} }
let syncState = "off", syncMsg = "", syncing = false, syncAgain = false, syncTimer;
const syncOn = () => !!(SY.token && SY.repo && SY.path);
function scheduleSync(ms=2500){ if(!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
function setSync(st, msg=""){ syncState = st; syncMsg = msg; updateSyncUi(); }
function updateSyncUi(){
  const st = syncOn() ? syncState : "off";
  const dot = $("#syncdot"); if(dot) dot.className = "syncdot " + st;
  const b = $("#syncbtn"); if(b) b.title = !syncOn() ? "Cloud sync is off" : st==="error" ? "Sync failed: "+syncMsg : st==="busy" ? "Syncing…" : "Synced";
  const c = $("#synccard"); const a = document.activeElement;
  if(c && !(c.contains(a) && /INPUT|TEXTAREA/.test(a.tagName))) c.innerHTML = syncCardHtml();
}
function syncCardHtml(){
  if(syncOn()){
    const st = syncState === "error" ? `<span style="color:var(--danger)">Sync failed — ${esc(syncMsg)}</span>`
      : syncState === "busy" ? "Syncing…" : SY.last ? "Synced " + ago(SY.last) : "Not synced yet";
    return `<div class="syncline"><span class="syncdot ${syncState}"></span><span>${st}</span></div>
      <p class="hint" style="margin:0 0 12px">Saving to <b>${esc(SY.repo)}</b> / ${esc(SY.path)}. Changes upload a few seconds after you log, and other devices pick them up within a minute.</p>
      <div class="btnrow"><button type="button" class="btn" data-act="sync-now">Sync now</button><button type="button" class="btn danger" data-act="sync-off">Disconnect</button></div>`;
  }
  return `<p class="hint" style="margin:0 0 12px">Keep your log in a private GitHub repo so it survives a lost phone and both parents see the same data. You need a private repo and a GitHub access token.</p>
    <a class="btn block" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:6px" href="https://github.com/settings/tokens/new?scopes=repo&amp;description=Little%20Log" target="_blank" rel="noopener">1 · Create a token on GitHub ↗</a>
    <p class="hint" style="margin:0 0 14px">The link opens GitHub with everything filled in. Set <b>Expiration</b> to <b>No expiration</b>, scroll down, tap <b>Generate token</b>, copy the code that starts with <b>ghp_</b> and paste it below.</p>
    <label class="f"><span>Repository (owner/name)</span><input class="inp" id="sy-repo" value="${esc(SY.repo || "DannyGelman95/CookieLife-data")}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f"><span>File in the repo</span><input class="inp" id="sy-path" value="${esc(SY.path || "littlelog.json")}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="f"><span>Access token</span><input class="inp" id="sy-token" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off"></label>
    ${syncState === "error" ? `<p class="hint" style="color:var(--danger)">${esc(syncMsg)}</p>` : ""}
    <button type="button" class="btn primary block" data-act="sync-connect">2 · Connect & sync</button>`;
}
function gh(path, opt={}){
  return fetch("https://api.github.com/repos/" + SY.repo + path, {...opt, cache:"no-store",
    headers:{Authorization:"Bearer " + SY.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opt.headers||{})}});
}
async function ghErr(r){
  let m = ""; try{ m = (await r.json()).message || ""; }catch(e){}
  if(r.status === 401) return new Error("the token was rejected (expired or mistyped)");
  if(r.status === 403) return new Error("the token can't write to this repo — give it Contents: Read and write");
  if(r.status === 404) return new Error("repo not found, or the token can't see it");
  return new Error(m || "GitHub error " + r.status);
}
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
function b64e(str){ const by = new TextEncoder().encode(str); let bin = ""; for(let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i+0x8000)); return btoa(bin); }
function b64d(b){ const bin = atob(b.replace(/\s/g, "")); const by = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
const ref = () => SY.branch ? "?ref=" + encodeURIComponent(SY.branch) : "";
async function pull(){
  const r = await gh("/contents/" + encPath(SY.path) + ref());
  if(r.status === 404) return {data:null, sha:null};
  if(!r.ok) throw await ghErr(r);
  const j = await r.json();
  let content = j.content;
  if(!content){   // files over 1 MB come back without content; read the blob instead
    const b = await gh("/git/blobs/" + j.sha); if(!b.ok) throw await ghErr(b);
    content = (await b.json()).content;
  }
  return {data:JSON.parse(b64d(content)), sha:j.sha};
}
function payloadOf(x){
  return {app:"littlelog", v:1, baby:x.baby || {}, babyU:x.babyU || 0, timers:x.timers || {}, timersU:x.timersU || 0,
    entries:(x.entries || []).slice().sort((a,b) => a.start - b.start || (a.id < b.id ? -1 : 1)), deleted:x.deleted || {}};
}
function merge(R){
  if(!R) return;
  const del = {...(R.deleted || {})};
  for(const k in S.deleted) del[k] = Math.max(del[k] || 0, S.deleted[k]);
  const map = new Map();
  for(const e of [...(R.entries || []), ...S.entries]){ const o = map.get(e.id); if(!o || (e.u || 0) > (o.u || 0)) map.set(e.id, e); }
  S.entries = [...map.values()].filter(e => !(del[e.id] >= (e.u || 0)));
  S.deleted = del;
  if((R.babyU || 0) > (S.babyU || 0)){ S.baby = {...S.baby, ...R.baby}; S.babyU = R.babyU; }
  if((R.timersU || 0) > (S.timersU || 0)){ S.timers = R.timers || {}; S.timersU = R.timersU; }
}
async function sync(){
  if(!syncOn()) return;
  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ setSync("error", "offline — will sync when back online"); return; }
  syncing = true; clearTimeout(syncTimer); setSync("busy");
  try{
    for(let attempt = 0; ; attempt++){
      const {data, sha} = await pull();
      const before = JSON.stringify(payloadOf(S));
      merge(data);
      const mine = payloadOf(S), body = JSON.stringify(mine);
      if(body !== before){ persist(); const a = document.activeElement; if(!(a && a.closest && a.closest("#app input, #app textarea"))) render(); }
      if(!data || JSON.stringify(payloadOf(data)) !== body){
        const r = await gh("/contents/" + encPath(SY.path), {method:"PUT", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({message:"Little Log update", content:b64e(JSON.stringify({...mine, savedAt:new Date().toISOString()})),
            ...(sha ? {sha} : {}), ...(SY.branch ? {branch:SY.branch} : {})})});
        if((r.status === 409 || r.status === 422) && attempt < 3) continue;   // another device wrote first — merge again
        if(!r.ok) throw await ghErr(r);
      }
      break;
    }
    SY.last = Date.now(); saveSync(); setSync("ok");
  }catch(e){
    setSync("error", e && e.message || "sync failed");
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; scheduleSync(300); }
  }
}
async function connectSync(){
  const repo = ($("#sy-repo").value || "").trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/$/, "");
  const path = ($("#sy-path").value || "").trim().replace(/^\//, "") || "littlelog.json";
  const token = ($("#sy-token").value || "").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("Repository should look like owner/name"); return; }
  if(!token){ toast("Paste your access token"); return; }
  SY = {repo, path, token};
  setSync("busy");
  try{
    const r = await gh(""); if(!r.ok) throw await ghErr(r);
    const j = await r.json();
    if(!j.private && !confirm(repo + " is PUBLIC — anyone on the internet could read your baby's log. Use it anyway?")){ SY = {repo, path}; setSync("off"); return; }
    SY.branch = j.default_branch; saveSync();
    await sync();
    if(syncState === "ok"){ toast("Cloud sync is on"); render(); }
  }catch(e){ SY = {repo, path}; saveSync(); setSync("error", "Couldn't connect: " + e.message); }
}

  if(ds.calf){ calFilter = ds.calf; const y = window.scrollY; render(); window.scrollTo(0, y); return; }

    chartSel[id] = chartSel[id] === i ? null : i;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if(ds.kind){ D.kind = ds.kind; refreshSheet(); return; }
  if(ds.side) return feedTap(ds.side);
  if(ds.milk){ D.milk = ds.milk; refreshSheet(); return; }
  if(ds.dkind){ D.kind = ds.dkind; refreshSheet(); return; }
  if(ds.amt){ D.amount = +ds.amt; const i = $("#amt"); if(i) i.value = D.amount; return; }
  if(ds.step){ const st = unit()==="oz" ? 0.5 : 10; D.amount = Math.max(0, Math.round(((+D.amount||0) + st*(+ds.step))*10)/10); const i = $("#amt"); if(i) i.value = D.amount; return; }
  if(ds.unit){ S.settings.unit = ds.unit; save(); render(); return; }
  if(ds.themeSet){ S.settings.theme = ds.themeSet; save(); render(); return; }
  switch(ds.act){
    case "vitd": D.vitD = !D.vitD; refreshSheet(); return;
    case "feed-save": return saveFeed();
    case "feed-stop": return feedStop();
    case "feed-discard": if(confirm("Discard this feeding timer?")){ delete S.timers.feed; save(); closeSheet(); render(); } return;
    case "diaper-save": return saveDiaper();
    case "sleep-save": return saveSleep();
    case "sleep-start": S.timers.sleep = {start:Date.now()}; save(); closeSheet(); render(); toast("Sleep timer started · sweet dreams"); return;
    case "sleep-stop": {
      const t = S.timers.sleep; if(!t) return;
      const inp = $("#sleepstart"); const start = inp ? fromInput(inp.value) : t.start;
      const end = Date.now(); delete S.timers.sleep;
      if(end - start < MIN){ save(); closeSheet(); render(); toast("Timer discarded (under a minute)"); return; }
      upsert({id:uid(), type:"sleep", start:Math.min(start, end-MIN), end}); closeSheet(); toast("Sleep saved · "+fmtDur(end-start)); return;
    }
    case "sleep-discard": if(confirm("Discard this sleep timer?")){ delete S.timers.sleep; save(); closeSheet(); render(); } return;
    case "delete": return removeEntry(D.id);
    case "export": download("little-log-backup-"+dayKey(Date.now())+".json", JSON.stringify(S, null, 2), "application/json"); return;
    case "import": $("#importfile").click(); return;
    case "csv": return exportCsv();
    case "sync-connect": connectSync(); return;
    case "sync-now": sync(); return;
    case "syncbtn": if(syncOn()) sync(); else { tab = "settings"; render(); setTimeout(() => { const c = $("#synccard"); if(c) c.scrollIntoView({behavior:"smooth", block:"center"}); }, 50); } return;
    case "sync-off": if(confirm("Stop syncing on this device? Your data stays here and in the repo.")){ SY = {}; saveSync(); setSync("off"); render(); } return;
    case "wipe": if(confirm("Delete every entry? This can't be undone (export a backup first if unsure).")){ const now = Date.now(); S.entries.forEach(e => { S.deleted[e.id] = now; }); S.entries = []; S.timers = {}; save(); render(); toast("All entries deleted"); } return;
  }
});
